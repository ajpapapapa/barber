<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>예약 관리 | no.5dom Barber Shop</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/order.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="order-page">
    <header class="header">
      <div class="container header-inner">
        <a href="index.html" class="logo">no.5dom<span>Barber</span></a>
        <a href="index.html" class="back-link">← 메인으로</a>
      </div>
    </header>

    <main class="container admin-wrap">
      <p class="label">ADMIN</p>
      <h1 class="order-title">예약 관리</h1>

      <!-- 로그인 -->
      <form id="login" class="step-box admin-login">
        <label class="field">
          <span>관리자 비밀번호</span>
          <input type="password" id="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-accent">확인</button>
        <p class="error" id="login-err"></p>
      </form>

      <!-- 예약 목록 -->
      <section id="board" hidden>
        <div class="admin-bar">
          <p class="hint" id="board-status"></p>
          <button type="button" class="btn-outline" id="refresh">새로고침</button>
        </div>
        <div id="board-list"></div>
      </section>
    </main>

    <script src="js/admin.js"></script>
  </body>
</html>
